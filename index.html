<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="기온·습도 예보 그래프와 과거 연도 비교가 가능한 날씨 대시보드" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⛅</text></svg>" />
    <title>날씨</title>
  </head>
  <body>
    <header class="app-header">
      <div class="brand">
        <span aria-hidden="true">⛅</span>
        <h1>날씨</h1>
        <button type="button" id="theme-toggle" class="ghost small" aria-label="테마 바꾸기"></button>
      </div>
      <div id="search-bar" class="search-bar"></div>
    </header>

    <main>
      <p id="status" class="status" role="status" aria-live="polite"></p>
      <section id="current" class="card current" aria-label="현재 날씨"></section>

      <nav class="tabs" role="tablist" aria-label="보기 선택">
        <button type="button" role="tab" id="tab-forecast" data-tab="forecast" aria-controls="panel-forecast">예보 그래프</button>
        <button type="button" role="tab" id="tab-compare" data-tab="compare" aria-controls="panel-compare">과거와 비교</button>
        <button type="button" role="tab" id="tab-korea" data-tab="korea" aria-controls="panel-korea">전국 날씨</button>
      </nav>

      <section id="panel-forecast" role="tabpanel" aria-labelledby="tab-forecast">
        <section id="daily" class="card daily" aria-label="주간 예보"></section>
        <div id="forecast-charts"></div>
      </section>
      <section id="panel-compare" role="tabpanel" aria-labelledby="tab-compare" hidden></section>
      <section id="panel-korea" role="tabpanel" aria-labelledby="tab-korea" hidden></section>
    </main>

    <footer class="muted small">
      데이터: <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo</a> (CC BY 4.0) ·
      지역 검색: <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">© OpenStreetMap</a>
    </footer>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
