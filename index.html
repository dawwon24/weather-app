<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="지난 날과 예보 기온을 하루 단위로 한 그래프에서 보는 날씨 앱" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⛅</text></svg>" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#f9f9f7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0d0d0d" media="(prefers-color-scheme: dark)" />
    <title>날씨</title>
  </head>
  <body>
    <header class="app-header">
      <div class="brand">
        <span aria-hidden="true">⛅</span>
        <h1>날씨</h1>
        <button type="button" id="search-toggle" class="icon-btn" aria-label="지역 검색" aria-expanded="false" aria-controls="search-box">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5" /><path d="M16 16l4.5 4.5" /></svg>
        </button>
        <button type="button" id="theme-toggle" class="ghost small" aria-label="테마 바꾸기"></button>
      </div>
      <div id="search-bar" class="search-bar"></div>
    </header>

    <main>
      <p id="status" class="status" role="status" aria-live="polite"></p>
      <section id="current" class="card current" aria-label="현재 날씨"></section>

      <div id="daily" class="daily"></div>
    </main>

    <footer class="muted small">
      데이터: <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo</a> (CC BY 4.0) ·
      지역 검색: <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">© OpenStreetMap</a>
    </footer>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
